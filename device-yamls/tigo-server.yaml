# Generated by the Tigo Monitor config wizard
# Board: m5stack-atoms3
# https://github.com/RAR/esphome-tigomonitor

esphome:
  name: tigo-server
  friendly_name: "Tigo Server"
  min_version: "2026.5.0"

external_components:
  - source:
      type: git
      url: https://github.com/RAR/esphome-tigomonitor
      ref: main
    components: [tigo_monitor, tigo_server]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/RAR/esphome-lp5562
    components: [lp5562]

esp32:
  board: m5stack-atoms3
  variant: esp32s3
  flash_size: 8MB
  partitions: ./tigo-8mb.csv
  framework:
    type: esp-idf
    version: recommended
    advanced:
      execute_from_psram: true
    components:
      - zakery292/esp_tsdb^2.4.1
      - joltwallet/littlefs^1.16
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_UART_ISR_IN_IRAM: "y"
      CONFIG_UART_RX_BUFFER_SIZE: "2048"
      CONFIG_UART_TX_BUFFER_SIZE: "512"
      CONFIG_FREERTOS_QUEUE_REGISTRY_SIZE: "32"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_LWIP_MAX_ACTIVE_TCP: "16"
      CONFIG_LWIP_MAX_LISTENING_TCP: "16"

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: INFO
  baud_rate: 0  # UART is the Tigo bus
#  hardware_uart: USB_SERIAL_JTAG # Reroutes ESPHome logs to the built-in USB port

api:
  encryption:
    key: !secret tigo_server_api_encryption_key

ota:
  - platform: esphome
    encryption:
    # Permits a later partition-table change over the air.
    # Applying one still needs `esphome upload --partition-table`;
    # `esphome run` never sends a partition table.
    allow_partition_access: true

uart:
  id: tigo_uart
  tx_pin: GPIO6
  rx_pin: GPIO5
  baud_rate: 38400
  rx_buffer_size: 2048

time:
  - platform: homeassistant
    id: tigo_time
    update_interval: 15min
    # Defaults to pool.ntp.org. If you point servers: at your router,
    # check it actually serves NTP — most do not, and a server that
    # never answers leaves the clock at epoch 0 and history empty.
    # Uncomment if the daily reset lands at the wrong hour:
    # timezone: "America/New_York"

tigo_monitor:
  id: tigo_hub
  uart_id: tigo_uart
  time_id: tigo_time
  number_of_devices: 40
  update_interval: 30s

tigo_server:
  id: tigo_web
  tigo_monitor_id: tigo_hub
  port: 80
  backlight: lcd_backlight

sensor:
  - platform: tigo_monitor
    tigo_monitor_id: tigo_hub
    name: "Total Output Power"
  - platform: tigo_monitor
    tigo_monitor_id: tigo_hub
    name: "Total Energy Out"
  - platform: tigo_monitor
    tigo_monitor_id: tigo_hub
    name: "Active Device Count"
  - platform: tigo_monitor
    tigo_monitor_id: tigo_hub
    name: "Free Internal RAM"
  - platform: tigo_monitor
    tigo_monitor_id: tigo_hub
    name: "Free PSRAM"

text_sensor:

binary_sensor:
  - platform: status
    id: wifi_status
    internal: true


# I2C bus for LP5562 (RGB LED + LCD Backlight control). The AtomS3R's internal
# bus is GPIO45/GPIO0. GPIO38/39 are the plain AtomS3's, and on the AtomS3R they
# are the bottom expansion header: there the LP5562 never answers and the
# screen stays dark (#93). Both are strapping pins, but the board wires them
# to its own bus, so ESPHome's warning about them doesn't apply.
i2c:
  sda:  # SYS_SDA
    number: GPIO45
    ignore_strapping_warning: true
  scl:  # SYS_SCL
    number: GPIO0
    ignore_strapping_warning: true
  scan: true

# LP5562 LED driver (controls RGB indicator LED + LCD backlight)
lp5562:
  id: rgb_driver
  address: 0x30

# SPI bus for the LCD
spi:
  id: sys_spi
  clk_pin: GPIO15
  mosi_pin: GPIO21

# Outputs for LP5562 channels
output:
  - platform: lp5562
    id: lp5562_red
    lp5562_id: rgb_driver
    channel: 0  # Red channel
  - platform: lp5562
    id: lp5562_green
    lp5562_id: rgb_driver
    channel: 1  # Green channel
  - platform: lp5562
    id: lp5562_blue
    lp5562_id: rgb_driver
    channel: 2  # Blue channel
  - platform: lp5562
    id: backlight_output
    lp5562_id: rgb_driver
    channel: 3  # White channel (LCD backlight)

# Light entities
light:
  # RGB indicator LED
  - platform: rgb
    name: "RGB LED"
    id: status_led
    red: lp5562_red
    green: lp5562_green
    blue: lp5562_blue
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
      - strobe:
          name: "Strobe"

  # LCD Backlight (LP5562 White Channel)
  - platform: monochromatic
    name: "LCD Backlight"
    id: lcd_backlight
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 0.5s

# --- Explicit ST7735 Architecture Profile ---
display:
  - platform: mipi_spi
    model: ST7735                 # Uses the universal hardware-level driver profile
    id: atoms3r_lcd
    spi_id: sys_spi
    cs_pin: GPIO14
    dc_pin: GPIO42
    reset_pin: GPIO48
    rotation: 0
    color_depth: 8bit
    data_rate: 40MHz
    invert_colors: true           # Vital for ST7735 text visibility

    # --- Precision Geometry Overrides for AtomS3R Panel ---
    dimensions:
      width: 128
      height: 128
      offset_width: 2
      offset_height: 1
      pad_width: 2
      pad_height: 3               # Sets up proper memory boundaries to match M5GFX

    update_interval: 5s
    setup_priority: -100
    lambda: |-
      // Background
      it.fill(COLOR_BLACK);
      
      // Header - Title
      it.print(64, 5, id(font_title), COLOR_WHITE, TextAlign::TOP_CENTER, "TIGO");
      it.print(64, 20, id(font_small), Color(150, 150, 150), TextAlign::TOP_CENTER, "Solar Monitor");
      
      // Divider line
      it.line(10, 35, 118, 35, Color(100, 100, 100));
      
      // Use cached values from tigo_monitor (updated during sensor publish)
      // This avoids iterating through 30+ devices on every display update
      int device_count = id(tigo_hub)->get_device_count();
      int online_count = id(tigo_hub)->get_online_device_count();
      float total_power = id(tigo_hub)->get_total_power();
      
      // Main stats
      if (device_count > 0) {
        // Total Power - Large and prominent
        it.printf(64, 45, id(font_large), COLOR_ORANGE, TextAlign::TOP_CENTER, "%.0fW", total_power);
        
        // Device status
        it.printf(64, 75, id(font_medium), COLOR_WHITE, TextAlign::TOP_CENTER, "%d/%d", online_count, device_count);
        it.print(64, 92, id(font_tiny), Color(150, 150, 150), TextAlign::TOP_CENTER, "devices online");
        
        // Status indicator
        if (online_count == device_count) {
          it.filled_circle(10, 110, 4, COLOR_GREEN);
          it.print(20, 107, id(font_small), COLOR_GREEN, TextAlign::CENTER_LEFT, "All OK");
        } else if (online_count > 0) {
          it.filled_circle(10, 110, 4, COLOR_ORANGE);
          it.printf(20, 107, id(font_small), COLOR_ORANGE, TextAlign::CENTER_LEFT, "%d Offline", device_count - online_count);
        } else {
          it.filled_circle(10, 110, 4, COLOR_RED);
          it.print(20, 107, id(font_small), COLOR_RED, TextAlign::CENTER_LEFT, "No Data");
        }
      } else {
        // No devices discovered yet
        it.print(64, 55, id(font_medium), Color(200, 200, 0), TextAlign::TOP_CENTER, "WAITING");
        it.print(64, 80, id(font_small), Color(150, 150, 150), TextAlign::TOP_CENTER, "for devices...");
        it.filled_circle(10, 110, 4, Color(200, 200, 0));
        it.print(20, 107, id(font_small), Color(200, 200, 0), TextAlign::CENTER_LEFT, "Scanning");
      }
      
      // WiFi status indicator (top right)
      if (id(wifi_status).state) {
        it.filled_circle(118, 10, 3, COLOR_GREEN);
      } else {
        it.filled_circle(118, 10, 3, COLOR_RED);
      }

# Color definitions
color:
  - id: COLOR_BLACK
    red: 0%
    green: 0%
    blue: 0%
  - id: COLOR_WHITE
    red: 100%
    green: 100%
    blue: 100%
  - id: COLOR_GREEN
    red: 0%
    green: 100%
    blue: 0%
  - id: COLOR_RED
    red: 100%
    green: 0%
    blue: 0%
  - id: COLOR_ORANGE
    red: 100%
    green: 65%
    blue: 0%

# Fonts for the display
font:
  - file: "gfonts://Roboto@bold"
    id: font_title
    size: 14
  - file: "gfonts://Roboto@bold"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_medium
    size: 18
  - file: "gfonts://Roboto"
    id: font_small
    size: 12
  - file: "gfonts://Roboto"
    id: font_tiny
    size: 9

