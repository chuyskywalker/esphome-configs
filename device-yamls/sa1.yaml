text_sensor:

  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Serial Number"
    register_type: holding
    address: 3
    raw_encode: ANSI
    response_size: 10


  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Grid side relay status"
    id: "sensor_194"
    register_type: holding
    address: 194
    raw_encode: HEXBYTES
    response_size: 2
    lambda: |-
      // The code is the low byte. The PDF says 1=Open/2=Closed, but real hardware is 0=Open (grid disconnected)
      // and 1=Closed (grid connected); see the note in the generator script.
      switch (modbus::helpers::byte_from_hex_str(x, 1)) {
        case 0: return std::string("Open");
        case 1: return std::string("Closed");
        default: return std::string("Unknown");
      }

  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Grid side relay status (raw)"
    id: "sensor_194_raw"
    entity_category: "diagnostic"
    register_type: holding
    address: 194
    raw_encode: HEXBYTES
    response_size: 2
    lambda: |-
      // The whole 16 bit register
      unsigned int value = (modbus::helpers::byte_from_hex_str(x, 0) << 8) | modbus::helpers::byte_from_hex_str(x, 1);
      char buf[8];
      snprintf(buf, sizeof(buf), "0x%04X", value);
      return std::string(buf);


  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Generator side relay status"
    id: "sensor_195"
    register_type: holding
    address: 195
    raw_encode: HEXBYTES
    response_size: 2
    lambda: |-
      // The code is the low 4 bits of the low byte; any other bits are not defined by the docs, see the raw sensor
      switch (modbus::helpers::byte_from_hex_str(x, 1) & 0x0F) {
        case 0: return std::string("Open");
        case 1: return std::string("Closed");
        case 2: return std::string("No Connection");
        case 3: return std::string("Closed, Generator is on");
        default: return std::string("Unknown");
      }

  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Generator side relay status (raw)"
    id: "sensor_195_raw"
    entity_category: "diagnostic"
    register_type: holding
    address: 195
    raw_encode: HEXBYTES
    response_size: 2
    lambda: |-
      // The whole 16 bit register
      unsigned int value = (modbus::helpers::byte_from_hex_str(x, 0) << 8) | modbus::helpers::byte_from_hex_str(x, 1);
      char buf[8];
      snprintf(buf, sizeof(buf), "0x%04X", value);
      return std::string(buf);


sensor:


  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Total Batt charge Power"
    id: "sensor_72"
    address: 72
    unit_of_measurement: "kWh"
    device_class: "energy"
    state_class: "total_increasing"
    register_type: holding
    value_type: U_DWORD_R
    filters:
    - multiply: 0.1
    - lambda: |-
        // if the value is NaN (not a number); then dip out entirely -- bad read
        if (std::isnan(x)) {
          id(log_to_ha).execute("Sensor 'Total Batt charge Power' (72) received NAN from Modbus");
          return {}; // Discard the invalid reading entirely
        }
        if (x == 0.0) {
          id(log_to_ha).execute("Sensor 'Total Batt charge Power' (72) received 0.0; bogus value skipped");
          return {}; // Discard the invalid reading entirely
        }
        // track the "last stable" known value so we can...
        static float last_stable = 0.0;
        if (last_stable == 0.0) { // first time? use it and we're out!
          last_stable = x;
          return x;
        }
        // ...discard if the reading zero's out or jumps by an impossible 100+ kWh
        // protects against bad reads, bit flips, noise causing weird nonsense. 
        // modbus DOES have CRC's, but...I've seen some WEIRD stuff.
        if (x < last_stable || (x - last_stable) > 100.0) {
          std::string log_msg = str_sprintf("Sensor 'Total Batt charge Power' (72) failed the value check; previous: %.1f, now: %.1f", last_stable, x);
          id(log_to_ha).execute(log_msg);
          return {};
        }
        last_stable = x;
        return x;


