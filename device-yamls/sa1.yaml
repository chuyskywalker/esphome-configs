binary_sensor:


  - platform: modbus_controller
    modbus_controller_id: modbus_client_sa
    name: "Grid connected"
    id: "grid_connected"
    device_class: connectivity
    register_type: holding
    address: 194
    lambda: |-
      return data[item->offset + 1] == 1;


  - platform: template
    name: "Modbus Device Status"
    id: device_online_status
    device_class: connectivity


  - platform: template
    device_class: "safety"
    name: "Alarm: F01 DC_Inversed_Failure"
    lambda: |-
      float raw = id(fault_word_0).state;
      if (std::isnan(raw)) return {}; // no valid read yet; publish nothing
      return (((uint16_t) raw >> 0) & 1) != 0;

