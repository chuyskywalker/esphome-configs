script:
  - id: log_to_ha
    mode: queued
    parameters:
      message: string
    then:
      - logger.log:
          level: ERROR
          tag: "error_tracking"
          format: "%s"
          args: [ 'message.c_str()' ]
      - homeassistant.service:
          service: system_log.write
          data:
            message: !lambda 'return message;'
            level: error
            logger: esphome.custom_device_sa1 # Helps you filter in HA


