
substitutions:
  name: solark-stats-sa1
  friendly_name: SolArk Stats SA1
  static_ip: 192.168.0.3
  gateway: 192.168.0.1
  subnet: 255.255.255.0
  api_key: !secret sa1_api_encryption_key
    

#
# SUBS ABOVE
#

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: dev
  # this is a bit of a hack; setting the status to online blindly.
  # however, the offline'ing script will eventually clear it if, on startup, the modbus doesn't connect
  on_boot:
    priority: 600.0
    then:
      - binary_sensor.template.publish:
          id: device_online_status
          state: ON
  
esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  #level: VERY_VERBOSE   #useful for debugging modbus
  # this turns off the warning about "slow" components; which modbus just takes time, yo. Chill.
  logs:
    component: ERROR

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    encryption:

## Disabled since this is ETHERNET based
#improv_serial:
#wifi:
#  ap: {}
#captive_portal:

# for board rev.7 and up
ethernet:
  type: "RTL8201"
  mdc_pin: GPIO16
  mdio_pin: GPIO17
  clk:
    mode: CLK_EXT_IN
    pin:
      number: 0
      ignore_strapping_warning: true
  phy_addr: 0
  phy_registers:
    - address: 0x10
      value: 0x1FFA
      page_id: 0x07
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: ${subnet}

web_server:
  port: 80
  ota: False
  version: 3
  local: True

# time:
#   - platform: homeassistant
#     id: homeassistant_time

## MODBUS STUFF

uart:
  - id: uart_modbus_client_sa
    rx_pin: 32
    tx_pin: 23
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

modbus:
  - id: modbus_sa
    uart_id: uart_modbus_client_sa
    send_wait_time: 500ms

modbus_controller:
- id: modbus_client_sa
  modbus_id: modbus_sa
  address: 0x01  # it's ALWAYS 0x1; per the docs: 
                 #
                 #   The inverter’s Slave ID is 0x01. This cannot be changed. The “Modbus SN” under
                 #   the “Parallel” tab does not affect the Slave ID for this map and is only relevant
                 #   to parallel configurations
                 #
  on_online:
    then:
      - logger.log: "Controller back online!"
      - binary_sensor.template.publish:
          id: device_online_status
          state: ON
  on_offline:
    then:
      - logger.log: "Controller goes offline!"
      - binary_sensor.template.publish:
          id: device_online_status
          state: OFF
  on_command_sent:
    then:
      - lambda: |-
          ESP_LOGI("modbus_monitor", "Command dispatched -> FC: %u (0x%02X), Address: %u (0x%04X)", function_code, function_code, address, address);

