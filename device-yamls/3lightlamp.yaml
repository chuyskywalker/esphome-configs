#              id(top_light_mono).turn_on().set_transition_length(0).set_brightness(target).perform();
#          } else {
#              id(top_light_mono).turn_off().set_transition_length(0).set_brightness(0.0f).perform();
#          }
          

  - id: set_mid_lights
    then:
      - lambda: |-

          if (!id(four_way_output_1).has_state()) {
            ESP_LOGD("main", "The four_way_output_1 is currently UNKNOWN / Uninitialized!");
            return;
          }
          if (!id(four_way_output_2).has_state()) {
            ESP_LOGD("main", "The four_way_output_2 is currently UNKNOWN / Uninitialized!");
            return;
          }

          // Now, figure out what state the LIGHTS are in
          float b1 = id(middle_light_mono).remote_values.get_brightness();
          float b2 = id(bottom_light_mono).remote_values.get_brightness();

          // in case of weird "is off, but brightness is != 0"          
          if (!id(middle_light_mono).remote_values.is_on()) {
            b1 = 0.0f;
          }
          if (!id(bottom_light_mono).remote_values.is_on()) {
            b2 = 0.0f;
          }

          // For this interaction, the switch is just pure on/off, so we map that out
          // regardless of what the dimmer may have been set to externally
          bool b1lit = (b1 <= 0.5f) ? false : true;
          bool b2lit = (b2 <= 0.5f) ? false : true;

          // determine the current mode based on the state of the two lights
          int current_mode = 0;
          if        (!b1lit && !b2lit) {
            current_mode = 0;
          } else if ( b1lit && !b2lit) {
            current_mode = 1;
          } else if (!b1lit &&  b2lit) {
            current_mode = 2;
          } else if ( b1lit &&  b2lit) {
            current_mode = 3;
          }

          // now that we know the current mode of the lights and which way the dial was turned,
          // we can determine the target mode.
          int target_mode = current_mode + 1;

          // handle the cases of rollover/under
          if (target_mode > 3) {
            target_mode = 0;
          }

          ESP_LOGD("light", "Current brightness is: %.2f/%.2f considered lit %d:%d, current mode: %d, target mode: %d", b1, b2, (int)b1lit, (int)b2lit, current_mode, target_mode);

          // now that we have a target mode, we can set the desired light on/off booleans to match
          // mode 0 == off / off
          // mode 1 ==  on / off
          // mode 2 == off /  on
          // mode 3 ==  on /  on
          bool b1_on = (target_mode == 1 || target_mode == 3);
          bool b2_on = (target_mode == 2 || target_mode == 3);

          ESP_LOGD("light", "Setting lights to: %d/%d", (int)b1_on, (int)b2_on);

          // LIGHT 'EM UP BOYS
          if (b1_on) {
              id(middle_light_mono).turn_on().set_transition_length(0).set_brightness(1.0f).perform();
          } else {
              id(middle_light_mono).turn_off().set_transition_length(0).set_brightness(0.0f).perform();
          }

          if (b2_on) {
              id(bottom_light_mono).turn_on().set_transition_length(0).set_brightness(1.0f).perform();
          } else {
              id(bottom_light_mono).turn_off().set_transition_length(0).set_brightness(0.0f).perform();
          }


      # add this delay so that if one of the pins changes right after the other (like when going 0/1 to 1/0)
      # it will hit the "single script execution denial" instead of running twice
      - delay: 500ms
