external_components:
  - source: github://robotdyn-dimmer/DimmerLink@main
    components: [dimmerlink]

i2c:
  id: dimmer_bus
  sda: GPIO08 # D9
  scl: GPIO07 # D8
  frequency: 100kHz

dimmerlink:
  - id: dimmer_top
    address: 0x50
  - id: dimmer_middle
    address: 0x51
  - id: dimmer_bottom
    address: 0x52

light:

  - platform: dimmerlink
    dimmerlink_id: dimmer_top
    id: top_light
    internal: true
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: dimmerlink
    dimmerlink_id: dimmer_middle
    id: middle_light
    internal: true
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

  - platform: dimmerlink
    dimmerlink_id: dimmer_bottom
    id: bottom_light
    internal: true
    gamma_correct: 1.0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF


  - platform: monochromatic
    name: "Top Light"
    id: top_light_mono
    output: top_scale_output
    gamma_correct: 1.0
    default_transition_length: 1s
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Middle Light"
    id: middle_light_mono
    output: middle_scale_output
    gamma_correct: 1.0
    default_transition_length: 1s
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    name: "Bottom Light"
    id: bottom_light_mono
    output: bottom_scale_output
    gamma_correct: 1.0
    default_transition_length: 1s
    restore_mode: ALWAYS_OFF


output:
  - platform: template
    id: top_scale_output
    type: float
    write_action:
      - lambda: |-
          if (state == 0.0f) {
            id(top_light).turn_off().set_brightness(0.0f).perform();
          } else {
            // Map 0.0 -> 1.0 down to a safe range of min -> max
            // Math: Base offset (min) + (slider * remaining available span)
            float lower_bound = id(top_light_min).state;
            float upper_bound = id(top_light_max).state;
            float safe_span = upper_bound - lower_bound;
            float scaled_brightness = lower_bound + (state * safe_span);
            //float scaled_brightness = state;
            
            ESP_LOGD("DimmerLink", "top output set to: %d%%", (int)(scaled_brightness * 100));
          
            // Forward the safely adjusted percentage to the DimmerLink component
            id(top_light).turn_on().set_brightness(scaled_brightness).perform();
          }
  - platform: template
    id: middle_scale_output
    type: float
    write_action:
      - lambda: |-
          if (state == 0.0f) {
            id(middle_light).turn_off().set_brightness(0.0f).perform();
          } else {
            // Map 0.0 -> 1.0 down to a safe range of min -> max
            // Math: Base offset (min) + (slider * remaining available span)
            float lower_bound = id(middle_light_min).state;
            float upper_bound = id(middle_light_max).state;
            float safe_span = upper_bound - lower_bound;
            float scaled_brightness = lower_bound + (state * safe_span);
            //float scaled_brightness = state;
            
            ESP_LOGD("DimmerLink", "middle output set to: %d%%", (int)(scaled_brightness * 100));
          
            // Forward the safely adjusted percentage to the DimmerLink component
            id(middle_light).turn_on().set_brightness(scaled_brightness).perform();
          }
  - platform: template
    id: bottom_scale_output
    type: float
    write_action:
      - lambda: |-
          if (state == 0.0f) {
            id(bottom_light).turn_off().set_brightness(0.0f).perform();
          } else {
            // Map 0.0 -> 1.0 down to a safe range of min -> max
            // Math: Base offset (min) + (slider * remaining available span)
            float lower_bound = id(bottom_light_min).state;
            float upper_bound = id(bottom_light_max).state;
            float safe_span = upper_bound - lower_bound;
            float scaled_brightness = lower_bound + (state * safe_span);
            //float scaled_brightness = state;
            
            ESP_LOGD("DimmerLink", "bottom output set to: %d%%", (int)(scaled_brightness * 100));
          
            // Forward the safely adjusted percentage to the DimmerLink component
            id(bottom_light).turn_on().set_brightness(scaled_brightness).perform();
          }

