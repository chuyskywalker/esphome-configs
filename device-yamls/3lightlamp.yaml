# Two switch that turns on the middle, bottom, or middle+bottom
# activates ground -> [ gpio, gpio ]. It's a 4 mode switch:
#                 Off/Off
#           On/On         Off/On
#                  On/Off
# 0/0 -> 0/1 -> 1/0 -> 1/1; loop
# One input, two outputs
# bottom_light_state == off + middle turned on -> state+
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO05 # D5
      mode: INPUT_PULLUP
      inverted: true
    id: four_way_output_1
    name: four_way_output_1
    filters:
      - delayed_on_off: 250ms
    on_state:
      - script.execute: set_mid_lights

  - platform: gpio
    pin:
      number: GPIO06 # D6
      mode: INPUT_PULLUP
      inverted: true
    id: four_way_output_2
    name: four_way_output_2
    filters:
      - delayed_on_off: 250ms
    on_state:
      script.execute: set_mid_lights

  - platform: dimmerlink
    dimmerlink_id: dimmer_top
    update_interval: 5s
    ready:
      name: "Top Ready"
    error:
      name: "Top Error"
    calibration_done:
      name: "Top Calibration Done"

  - platform: dimmerlink
    dimmerlink_id: dimmer_middle
    update_interval: 5s
    ready:
      name: "Middle Ready"
    error:
      name: "Middle Error"
    calibration_done:
      name: "Middle Calibration Done"

  - platform: dimmerlink
    dimmerlink_id: dimmer_bottom
    update_interval: 5s
    ready:
      name: "Bottom Ready"
    error:
      name: "Bottom Error"
    calibration_done:
      name: "Bottom Calibration Done"

select:
  - platform: dimmerlink
    dimmerlink_id: dimmer_top
    curve:
      name: "Top Dimming Curve"
  - platform: dimmerlink
    dimmerlink_id: dimmer_middle
    curve:
      name: "Middle Dimming Curve"
  - platform: dimmerlink
    dimmerlink_id: dimmer_bottom
    curve:
      name: "Bottom Dimming Curve"

# The rotary AC dial is different. States are:
# Off, Medium, High
# With an AC input, medium has a diode that chops off the lower half of the AC voltage, tada, half power
# We just need to read it and send the 0/50/100 to the dimmer light
sensor:

  - platform: dimmerlink
    dimmerlink_id: dimmer_top
    update_interval: 60s
    ac_frequency:
      name: "Top AC Frequency"
    level:
      name: "Top Brightness Level"
    firmware_version:
      name: "Top Firmware"
    ac_period:
      name: "Top AC Period"

  - platform: dimmerlink
    dimmerlink_id: dimmer_middle
    update_interval: 60s
    ac_frequency:
      name: "Middle AC Frequency"
    level:
      name: "Middle Brightness Level"
    firmware_version:
      name: "Middle Firmware"
    ac_period:
      name: "Middle AC Period"

  - platform: dimmerlink
    dimmerlink_id: dimmer_bottom
    update_interval: 60s
    ac_frequency:
      name: "Bottom AC Frequency"
    level:
      name: "Bottom Brightness Level"
    firmware_version:
      name: "Bottom Firmware"
    ac_period:
      name: "Bottom AC Period"

  - platform: adc
    pin: GPIO04 # D3
    name: "Rotary Dial Voltage"
    id: rotary_dial_voltage
    update_interval: 50ms # Kept relatively fast so it catches quick turns
    filters:
      - median:
          window_size: 5
          send_every: 5
      - delta: 0.2
      - debounce: 150ms
    on_value:
      then:
        - lambda: |-
            
            // WHAT the voltage is doesn't really matter; we've debounced to get a single click, now we act based
            // on the state of the light.

            static bool is_first_run = true;
            if (is_first_run) {
              ESP_LOGI("main", "First invocation of top light; skipping");
              is_first_run = false;
              return;
            }
            
            float b = id(top_light_mono).remote_values.get_brightness();
            float target = 0.0f;
            
            // The light dial only rotates clockwise, and we assume off->100%->50%->off
            // as the cycle. However, since the brightness can be set via homeassistant as well
            // we have to check ranges and best-guess what a clockwise rotation might mean
            if (b <= 0.2f) {
              // off or low, next step would be full bright:
              target = 1.0f;
            } else if (b > 0.2f && b <= 0.6f) {
              // somewhere in a medium state, turn off 
              target = 0.0f;
            } else {
              // in a bright state, go medium
              target = 0.25f;
            }
            
            ESP_LOGD("light", "Light is at %.2f, setting to next state 'down' %.2f", b, target);
            
            if (target > 0.0f) {
                id(top_light_mono).turn_on().set_transition_length(0).set_brightness(target).perform();
            } else {
                id(top_light_mono).turn_off().set_transition_length(0).set_brightness(0.0f).perform();
            }

script:
#  - id: set_top_light
#
#    # available states:
#    # 0, 1, 2
#    # LOL NO; physical switch can only go one way (0>1>2>0)
#    # it's got a clutch that stops backwards movement
#    # so any change is a "clockwise" basically
