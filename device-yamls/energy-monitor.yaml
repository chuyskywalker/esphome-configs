
substitutions:
  name: energy-meter
  friendly_name: Energy Meter
  static_ip: 192.168.0.6
  gateway: 192.168.0.1
  subnet: 255.255.254.0
  api_key: !secret energy_monitor_api_encryption_key
  ota_pass: !secret energy_monitor_ota_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # This block delays initial sensor data publishing on boot
  on_boot:
    priority: -100.0  # Runs after WiFi, MQTT, and API connections are ready
    then:
      - delay: 15s     # Wait 15 seconds for energy ICs to stabilize
      - logger.log: "Boot delay finished. Allowing sensor publishing."

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO
  # level: VERBOSE
  # logs:
  #   modbus: VERBOSE
  #   modbus_controller: VERBOSE
  #   # Turn down everything else so your log screen doesn't fly by too fast:
  #   sensor: DEBUG
  #   component: DEBUG
  #   i2c.idf: NONE

# Enable Home Assistant API
api:
  encryption:
    key: ${api_key}

# allow for remote updates
ota:
  - platform: esphome
    password: ${ota_pass}

ethernet:
  type: W5500
  clk_pin: GPIO42
  mosi_pin: GPIO43
  miso_pin: GPIO44
  cs_pin: GPIO41
  interrupt_pin: GPIO2
  reset_pin: GPIO1

uart:
  rx_pin: 9
  tx_pin: 10
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE

web_server:
  port: 80
  ota: False
  version: 3
  local: True

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: ESP IP Address
      id: eth_ip

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 15

i2c:
  sda: 18
  scl: 17

# TODO: seems like we could do something way more fun with this than just IP address
#       maybe keep a running tally of kwh, or current amps/watts, etc.
#       a cool running graph of the last 15 minutes or something? I dunno!
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0, 15, id(roboto), "IP: %s", id(eth_ip).state.c_str());

modbus:
  id: modbus_to_arm32
  turnaround_time: 200ms

# In theory, it would make sense to poll watts/amps quicker than kWh (since the later changes slowly)
# However, because of the optimized modbus polling, getting the kWh values just as frequently
# doesn't cost any extra.
modbus_controller:
  - id: modbod
    address: 1
    # I have measured the full response (all 6 banks) taking around 3 seconds.
    update_interval: 5s
    # update_interval: 60s

sensor:


  # ct 01, bank 1, pin 1, addr_offset 100
  
  # current (amps)
  - platform: modbus_controller
    id: ct_01_current
    name: ct_01_current
    internal: true
    address: 100
    register_type: holding
    value_type: U_DWORD_R
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 3
    filters:
    - multiply: 0.001

  # power (watts)
  - platform: modbus_controller
    id: ct_01_power
    name: ct_01_power
    internal: true
    address: 120
    register_type: holding
    value_type: S_DWORD_R
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    filters:
    - multiply: 0.1

  # energy (kWh)
  - platform: modbus_controller
    id: ct_01_energy
    name: ct_01_energy
    internal: true
    address: 140
    register_type: holding
    value_type: FP32_R
    unit_of_measurement: kWh
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  # ct 02, bank 1, pin 2, addr_offset 102
  
  # current (amps)
