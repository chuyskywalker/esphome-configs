
substitutions:
  name: energy-meter
  friendly_name: Energy Meter
  static_ip: 192.168.0.6
  gateway: 192.168.0.1
  subnet: 255.255.254.0
  api_key: !secret energy_monitor_api_encryption_key
  ota_pass: !secret energy_monitor_ota_password

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  # baud_rate: 0

# Enable Home Assistant API
api:
  encryption:
    key: ${api_key}

# allow for remote updates
ota:
  - platform: esphome
    password: ${ota_pass}

ethernet:
  type: W5500
  clk_pin: GPIO42
  mosi_pin: GPIO43
  miso_pin: GPIO44
  cs_pin: GPIO41
  interrupt_pin: GPIO2
  reset_pin: GPIO1
  manual_ip:
    static_ip: ${static_ip}
    gateway: ${gateway}
    subnet: ${subnet}

uart:
  rx_pin: 9
  tx_pin: 10
  baud_rate: 115200
  stop_bits: 1
  data_bits: 8
  parity: NONE

web_server:
  port: 80
  ota: False
  version: 3
  local: True

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: ESP IP Address
      id: eth_ip
    # none of this gets used; commenting out
    #   address_0:
    #     name: ESP IP Address 0
    #   address_1:
    #     name: ESP IP Address 1
    #   address_2:
    #     name: ESP IP Address 2
    #   address_3:
    #     name: ESP IP Address 3
    #   address_4:
    #     name: ESP IP Address 4
    # dns_address:
    #   name: ESP DNS Address
    # mac_address:
    #   name: ESP MAC Address

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 15

i2c:
  sda: 18
  scl: 17

# TODO: seems like we could do something way more fun with this than just IP address
#       maybe keep a running tally of kwh, or current amps/watts, etc.
#       a cool running graph of the last 15 minutes or something? I dunno!
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    lambda: |-
      it.printf(0, 15, id(roboto), "IP: %s", id(eth_ip).state.c_str());

modbus:

modbus_controller:
  - address: 1
    update_interval: 5s

sensor:


  ##############   Microwave (P1B1)   ##############
  

  ### bank: 1, pin: 1, ct: 1

  # current (amps)
  - platform: modbus_controller
    id: ct_1_current
    internal: true
    address: 100
    register_type: holding
    value_type: U_DWORD_R
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 3
    filters:
    - multiply: 0.001

  # power (watts)
  - platform: modbus_controller
    id: ct_1_power
    internal: true
    address: 120
    register_type: holding
    value_type: S_DWORD_R
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    filters:
    - multiply: 0.1

  # energy (kWh)
  - platform: modbus_controller
    id: ct_1_energy
    internal: true
    address: 140
    register_type: holding
    value_type: FP32_R
    unit_of_measurement: kWh
    state_class: total_increasing
    device_class: energy
    accuracy_decimals: 3

  - platform: combination
    type: sum
    name: "Microwave (P1B1) Load"
    id: microwave_p1b1_current
    sources:
      - source: ct_1_current

  - platform: combination
    type: sum
    name: "Microwave (P1B1) Power"
    id: microwave_p1b1_power
    sources:
      - source: ct_1_power

  - platform: combination
    type: sum
    name: "Microwave (P1B1) Energy"
    id: microwave_p1b1_energy
    # this specific stateclasss must be defined
    state_class: total_increasing
    sources:
      - source: ct_1_energy

